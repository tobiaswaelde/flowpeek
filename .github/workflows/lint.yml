name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://flowpeek:flowpeek@localhost:5432/flowpeek_lint
      SHADOW_DATABASE_URL: postgresql://flowpeek:flowpeek@localhost:5432/flowpeek_lint_shadow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint shared configuration
        run: pnpm exec eslint .

      - name: Lint API
        if: hashFiles('apps/api/tsconfig.json') != ''
        run: pnpm --dir apps/api lint

      - name: Typecheck API
        if: hashFiles('apps/api/tsconfig.json') != ''
        run: pnpm nx run api:db:generate && pnpm --dir apps/api typecheck

      - name: Lint web app
        if: hashFiles('apps/web/nuxt.config.ts') != ''
        run: pnpm --dir apps/web lint

      - name: Typecheck web app
        if: hashFiles('apps/web/nuxt.config.ts') != ''
        run: pnpm --dir apps/web typecheck
