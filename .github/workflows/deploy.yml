name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true

  publish-images:
    name: Publish container images
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      images-ready: ${{ steps.image-inputs.outputs.ready }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check image build inputs
        id: image-inputs
        run: |
          if [[ -f apps/api/Dockerfile && -f apps/web/Dockerfile ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Dockerfiles are not available yet; skipping image publication.'
          fi

      - name: Set up Docker Buildx
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release version
        if: steps.image-inputs.outputs.ready == 'true'
        id: version
        run: |
          version="$(node -p \"require('./package.json').version\")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flowpeek-api:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/flowpeek-api:latest

      - name: Build and push web image
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flowpeek-web:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/flowpeek-web:latest

  smoke-release:
    name: Smoke test release images
    needs:
      - release
      - publish-images
    if: >-
      needs.release.outputs.published == 'true' && needs.publish-images.outputs.images-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Compose smoke-test inputs
        id: compose-inputs
        run: |
          if [[ -f compose.yml ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Compose configuration is not available yet; skipping smoke test.'
          fi

      - name: Log in to GitHub Container Registry
        if: steps.compose-inputs.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release version
        if: steps.compose-inputs.outputs.ready == 'true'
        id: version
        run: |
          version="$(node -p \"require('./package.json').version\")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare Compose environment
        if: steps.compose-inputs.outputs.ready == 'true'
        run: cp .env.example .env

      - name: Validate release image tags
        if: steps.compose-inputs.outputs.ready == 'true'
        env:
          FLOWPEEK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          expected_api="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowpeek-api:${FLOWPEEK_VERSION}"
          expected_web="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowpeek-web:${FLOWPEEK_VERSION}"
          docker compose -f compose.yml config --images | grep --fixed-strings --line-regexp "$expected_api"
          docker compose -f compose.yml config --images | grep --fixed-strings --line-regexp "$expected_web"

      - name: Start release stack
        if: steps.compose-inputs.outputs.ready == 'true'
        env:
          FLOWPEEK_VERSION: ${{ steps.version.outputs.value }}
        run: docker compose -f compose.yml up --detach --wait --wait-timeout 120

      - name: Check API health
        if: steps.compose-inputs.outputs.ready == 'true'
        run: curl --fail --retry 12 --retry-connrefused --retry-delay 5 http://localhost:3001/api/health

      - name: Stop release stack
        if: always() && steps.compose-inputs.outputs.ready == 'true'
        run: docker compose -f compose.yml down --volumes --remove-orphans
